name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    name: Import, unit tests, new-game playtest, screenshots
    runs-on: ubuntu-latest
    # A GDScript parse error leaves Godot idling instead of exiting, so every
    # Godot step is also wrapped in `timeout` to fail fast rather than hang.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /opt/godot/godot4
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/godot
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot_extract
          mv "/tmp/godot_extract/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /opt/godot/godot4
          chmod +x /opt/godot/godot4

      - name: Install Xvfb + Mesa software renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri

      - name: Verify Pokémon glbs (rigged, 18 clips each)
        run: |
          python3 pipeline/blender/verify_glb.py godot/assets/models/pokemon --require-skin --min-kb 20 \
            --anims Idle,Walk,Run,Attack,Special,Hurt,Faint,Victory,Sleep,Roar,Dodge,Spin,Hop,Charge,Taunt,Spawn,Hover,Talk

      - name: Import project
        run: timeout 20m /opt/godot/godot4 --headless --path godot --import

      - name: Run unit tests
        run: |
          set -o pipefail
          timeout 10m /opt/godot/godot4 --headless --path godot -- --run-tests 2>&1 | tee test.log
          grep -q "=== [0-9]* passed, 0 failed ===" test.log

      - name: New-game playtest (Pallet -> Oak -> starter -> rival battle)
        run: timeout 10m /opt/godot/godot4 --headless --path godot -- --scene=ow_playtest

      - name: Capture screenshots (core scenes, menus, battle, overworld)
        run: |
          mkdir -p artifacts/screenshots
          shot() {
            local name="$1"; shift
            timeout 3m xvfb-run -a /opt/godot/godot4 --path godot --rendering-driver opengl3 \
              -- --screenshot="$PWD/artifacts/screenshots/$name.png" "$@"
            test -s "artifacts/screenshots/$name.png"
          }
          for scene in title intro overworld battle start_menu party summary bag pokedex trainer_card town_map options dialogue; do
            shot "$scene" --scene="$scene" --wait=1.5
          done
          shot wtp-quiz --scene=wtp --wait=1.5
          shot pallet-town --scene=overworld --map=PalletTown --pc=10,9 --wait=1.5
          shot battle-flamethrower --scene=battle --wait=0.3 --player=CHARIZARD --player_level=50 \
            --enemy=BLASTOISE --level=50 --env=grass --state=vfx --move=FLAMETHROWER --vfx_t=0.4

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: error
